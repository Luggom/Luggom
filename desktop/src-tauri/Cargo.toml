[package]
name = "luggom-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Desktop Luggom — minerador + carteira com a seed (Tauri)"
default-run = "luggom-desktop"

[lib]
name = "luggom_desktop"
path = "src/lib.rs"

[[bin]]
name = "luggom-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
luggom-core = { workspace = true }
luggom-wallet = { workspace = true }
