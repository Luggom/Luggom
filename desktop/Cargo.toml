[workspace]
resolver = "2"
members = ["core", "wallet", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
luggom-core = { path = "core" }
luggom-wallet = { path = "wallet" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
