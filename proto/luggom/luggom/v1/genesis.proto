syntax = "proto3";
package luggom.luggom.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "luggom/luggom/v1/params.proto";

option go_package = "luggom/x/luggom/types";

// GenesisState defines the luggom module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
